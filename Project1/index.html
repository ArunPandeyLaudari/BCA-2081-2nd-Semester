<!DOCTYPE html>
<html lang="en">
<head>

    <title>Portfolio-Arun Pandey Laudari</title>
    <link rel="shortcut icon" href="./hrlogo.jpeg" type="image/x-icon">

    <!-- font ko link corako -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
 
    <style>

      

        body{
         font-family: "Roboto", sans-serif;
        }

      
        #top-header{
            background-color: black;
            height: 60px;
            border-radius: 10px;
            width: 100%;
           display: flex;
        }

        #top-header .logo{
            height: 100%;
            width: 10%; 
           
            display: flex;
            justify-content: center;
            align-items: center;
            
        }

        .logo a{
            color: wheat;
            font-size: 20px;
            text-decoration: none;

        }

        #top-header .navbarlist{
            height: 100%;
            width: 90%; 
            display: flex;
            justify-content: end;
            align-items: center;


        }

        .navbarlist a{
            color: wheat;
            text-decoration: none;
            padding-right: 40px;
        }

         .navbarlist a:hover{
            color: white;
         }




         .navbarlist #contactme{
            color: wheat;
            background-color: blueviolet;
            padding: 10px;
            margin-right: 10px;
            border-radius: 10px;
         }

          .navbarlist #contactme:hover{
            color: black;
            background-color: wheat;
            transition: all 1s ease-out;
          }

          .herosection{
            height: 450px;
            width: 100%;
            background-color: rgb(19, 17, 47);
            display: flex;

          }

        .herosection .intro{
            height: 100%;
            width: 50%;
            background-color: brown;
        }

        .herosection .profile{
             height: 100%;
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .profile img{
            height: 300px;
            width: 300px;
            border-radius: 50%;
            border: 2px solid blueviolet;
        }







    </style>
</head>
<body>
  <header id="top-header">

    <div class="logo">

       <a href="#">Arun.py</a>

    </div>

    <nav class="navbarlist">

      
        <a href="#">Home</a>
        <a href="#">About Me</a>
        <a href="#">Servies</a>
        <a href="#">Projects</a>
        <a href="#">Education</a>
        <a href="#" id="contactme">Contact Me</a>
     

      

    </nav>
  </header>


  <div class="herosection">
    <div class="intro">
        <h1>Hello there,</h1>
        <h2>I am Sudarshan Poudel.</h2>
        <h3>Bridging people and machines — with AI that works for you.</h3>
    </div>
    <div class="profile">
        <img src="./images/sudarsan.jpg" alt="">
    </div>
