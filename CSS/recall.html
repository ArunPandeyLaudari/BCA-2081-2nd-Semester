<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS DAY1</title>
    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .container{
            height: 200px;
            width: 400px;
            background-color: red;
            color: white;
            border-radius: 10px;
            border: 2px solid black;
            padding: 20px 10px 23px 33px;
            
           
        }

        p{
            letter-spacing: 10px;
            text-shadow: 20px 10px 5px rgba(0, 0, 0, 0.856) ;
        }
    </style>
</head>
<body>

    <div class="container">
        this is a container
    </div>

    <p>This is a random paragarph</p>
    
</body>
</html>
