<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>

    <style>
        .parent-container{
            height: 800px;
            width: 900px;
            background-color: rgb(25, 5, 5);
            position: relative;
        }

        .child{
            height: 200px;
            width: 200px;
        }

        #child1{
            background-color: gray;
            
        }
        #child2{
            background-color: rgb(67, 25, 145);
            position: absolute;
            top: 0;
            right: 0;
          
        }
        #child3{
            background-color: rgb(186, 67, 97);
        }
        #child4{
            background-color: rgb(106, 157, 190);
            position: absolute;
            bottom: 0;
            right: 0;   
        }
        #child5{
            background-color: rgb(117, 173, 165);
            position:absolute;
            bottom: 0;
            left: 0;
        }
          </style>
</head>
<body>
    
    <div class="parent-container">
        <div class="child" id="child1">This is child 1</div>
        <div class="child" id="child2">This is child 2</div>
        <div class="child" id="child3">This is child 3</div>
        <div class="child" id="child4">This is child 4</div>
        <div class="child" id="child5">This is child 5</div>
    </div>

</body>
</html>
